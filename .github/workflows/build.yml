name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        shell: pwsh

      - name: Build
        run: cmake --build build
        shell: pwsh

      - name: Run PowerSupply tests
        run: .\build\EmulatorPSW7Tests.exe
        shell: pwsh

      - name: Run Database tests
        run: .\build\EmulatorPSW7DatabaseTests.exe
        shell: pwsh

      - name: Start emulator (background)
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $proc = Start-Process -FilePath ".\build\EmulatorPSW7.exe" -PassThru -WindowStyle Hidden
          $proc.Id | Out-File -FilePath emulator.pid
          Start-Sleep -Seconds 5
          $running = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $running) {
            Write-Host "Emulator failed to start."
            exit 1
          }
          Write-Host "Emulator PID: $($proc.Id)"
        shell: pwsh

      - name: Run UDP integration tests
        run: .\build\EmulatorPSW7UdpTests.exe
        shell: pwsh

      - name: Run HTTP integration tests
        run: .\build\EmulatorPSW7HttpTests.exe
        shell: pwsh

      - name: Run CommandImporter integration tests
        run: .\build\EmulatorPSW7ImporterTests.exe
        shell: pwsh

      - name: Stop emulator
        run: Stop-Process -Name EmulatorPSW7 -ErrorAction SilentlyContinue
        shell: pwsh


      - name: Install Doxygen
        uses: ssciwr/doxygen-install@v1

      - name: Generate Doxygen docs
        run: doxygen Doxyfile
        shell: pwsh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4